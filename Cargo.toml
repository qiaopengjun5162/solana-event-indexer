[package]
edition = "2024"
license = "MIT"
name = "solana-event-indexer"
readme = "README.md"
version = "0.1.0"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true

[profile.profiling]
debug = "full"
inherits = "release"
strip = false

[dependencies]
anyhow = "1.0.98"
config = { version = "0.15.13", features = ["toml"] }
dotenvy = "0.15.7"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["default"] }
solana-client = "2.3.4"
sqlx = { version = "0.8.6", features = [
  "postgres",
  "runtime-tokio",
  "tls-rustls",
] }
tokio = { version = "1.46.1", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[dev-dependencies]

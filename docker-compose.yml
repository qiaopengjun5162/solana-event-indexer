services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: solana_events
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_swaps.sql:/docker-entrypoint-initdb.d/001_swaps.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d solana_events"]
      interval: 5s
      timeout: 5s
      retries: 5

  indexer:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SOLANA_DATABASE_URL: postgres://postgres:postgres@postgres:5432/solana_events
    volumes:
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["./solana-event-indexer"]

volumes:
  postgres_data:
